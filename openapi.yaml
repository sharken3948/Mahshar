openapi: 3.1.0
info:
  title: Mahshar V2 Agent API
  version: 2.2.0
  description: |
    Public machine interface for discovering and purchasing proxied APIs with
    Circle Gateway x402 v2 on Arc Mainnet (chain 5042, CAIP-2 eip155:5042).
    Seller upstream URLs and credentials are never part of this contract.
    Listing-specific path/query/body declarations are returned by discovery;
    this static document defines their transport but does not generate one
    OpenAPI path per seller listing.
servers:
  - url: https://mahshar.example
    description: Example only; the served document substitutes MARKETPLACE_ORIGIN.
tags:
  - { name: Discovery }
  - { name: Paid execution }
  - { name: Purchase access }
  - { name: Recovery }
paths:
  /api/openapi:
    get:
      tags: [Discovery]
      operationId: getOpenApi
      summary: Retrieve this OpenAPI document
      responses:
        '200':
          description: OpenAPI YAML
          content:
            application/yaml:
              schema: { type: string }
  /api/agent/discover:
    get:
      tags: [Discovery]
      operationId: discoverApis
      summary: Discover active listings and the public payment contract
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
      responses:
        '200':
          description: Agent catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Discovery' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/proxy:
    post:
      tags: [Paid execution]
      operationId: executeEnvelopeListing
      summary: Probe or execute any listing through the envelope proxy
      description: |
        The outer method is POST. `method` is the configured upstream method.
        `path` is an optional relative suffix containing only path segments and
        ordinary query inputs declared by the selected listing. First omit Payment-Signature. A
        402 has body `{}` and a base64 x402 v2 challenge in PAYMENT-REQUIRED.
        Retry the identical URL and JSON body with Payment-Signature.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnvelopeRequest' }
      responses:
        '200': { $ref: '#/components/responses/PaidResult' }
        '400': { $ref: '#/components/responses/Error' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '409': { $ref: '#/components/responses/DeliveryConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/PaidResult' }
        '503': { $ref: '#/components/responses/Error' }
  /api/proxy/{api_id}:
    parameters:
      - name: api_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Paid execution]
      operationId: executeGetListing
      summary: Probe or execute a GET listing
      description: Append only ordinary query parameters declared by this listing's discovery metadata. GET request bodies are rejected.
      responses:
        '200': { $ref: '#/components/responses/PaidResult' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '405': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/DeliveryConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Paid execution]
      operationId: executePostListing
      summary: Probe or execute a POST listing
      description: Declared ordinary query parameters may be appended to the proxy URL. JSON is parsed and re-serialized before being sent upstream.
      requestBody:
        required: false
        content:
          application/json:
            schema: {}
      responses:
        '200': { $ref: '#/components/responses/PaidResult' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '405': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/DeliveryConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/calls/last-response:
    get:
      tags: [Purchase access]
      operationId: retrievePurchasedResponse
      summary: Retrieve the private response for the exact authorized purchase
      description: |
        Send `x-mahshar-purchase-access` with the purchase-scoped capability.
        A browser wallet session may exchange a legacy owned purchase for a
        capability. `buyer_wallet` alone is never ownership.
      security:
        - purchaseAccess: []
        - walletSession: []
      parameters:
        - { name: api_id, in: query, required: true, schema: { type: string } }
        - { name: buyer_wallet, in: query, required: true, schema: { type: string } }
        - { name: x-mahshar-purchase-access, in: header, required: false, schema: { type: string } }
      responses:
        '200':
          description: Stored response and optionally a newly issued capability
          content:
            application/json:
              schema:
                type: object
                properties:
                  response_body: {}
                  purchase_access_token: { type: string }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/payments/reconcile:
    post:
      tags: [Recovery]
      operationId: reconcilePaymentAccounting
      summary: Reconcile accounting; never settles or replays upstream delivery
      security:
        - walletSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [attemptId]
              properties:
                attemptId: { type: string, format: uuid }
      responses:
        '200': { description: Accounting complete }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/DeliveryConflict' }
        '503': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    walletSession:
      type: apiKey
      in: cookie
      name: mahshar_session
      description: Eight-hour HttpOnly browser wallet session.
    purchaseAccess:
      type: apiKey
      in: header
      name: x-mahshar-purchase-access
  schemas:
    EnvelopeRequest:
      type: object
      additionalProperties: false
      required: [api_id, buyer_wallet]
      properties:
        api_id: { type: string, format: uuid }
        buyer_wallet:
          type: string
          description: Probe hint only; the verified settlement payer is authoritative.
        method: { type: string, enum: [GET, POST, PUT, DELETE] }
        path: { type: string, description: Relative path segments and/or query string. Every value must be declared by discovery; query input does not require dynamic path support. }
        body: { description: JSON for POST, PUT, or DELETE. Required when discovery says body.required=true. GET bodies are rejected. }
    PaymentRequirement:
      type: object
      required: [scheme, network, asset, amount, payTo, maxTimeoutSeconds, extra]
      properties:
        scheme: { const: exact }
        network: { const: 'eip155:5042' }
        asset: { type: string }
        amount: { type: string, pattern: '^[0-9]+$' }
        payTo: { type: string }
        maxTimeoutSeconds: { type: integer }
        extra:
          type: object
          required: [name, version, verifyingContract]
          properties:
            name: { const: GatewayWalletBatched }
            version: { const: '1' }
            verifyingContract: { type: string }
    PaymentRequired:
      type: object
      required: [x402Version, resource, accepts]
      properties:
        x402Version: { const: 2 }
        resource: { type: object }
        accepts:
          type: array
          items: { $ref: '#/components/schemas/PaymentRequirement' }
    PaidResult:
      type: object
      required: [payment, delivery_state, attemptId, purchase_access_token]
      properties:
        response: { description: Upstream JSON value or text string. }
        latency_ms: { type: integer }
        payment: { const: ACCOUNTING_COMPLETE }
        delivery_state: { enum: [SUCCEEDED, FAILED_RETRYABLE, FAILED_FINAL, UNKNOWN] }
        retryable: { type: boolean }
        attemptId: { type: string, format: uuid }
        purchase_access_token: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string }
        attemptId: { type: string }
        delivery_state: { type: string }
        retryable: { type: boolean }
    AgentListing:
      type: object
      required: [id, name, method, proxy_url, proxy_style, request, response]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        price_per_call_usdc: { type: number }
        payment_model: { const: x402-pay-per-call }
        method: { type: string, enum: [GET, POST, PUT, DELETE] }
        proxy_style: { type: string, enum: [path, envelope] }
        proxy_url: { type: string, format: uri }
        auth:
          type: object
          required: [type, injected_by, credential_location, seller_credentials_exposed]
          properties:
            type: { enum: [public, apikey, bearer, queryparam] }
            injected_by: { enum: [none, mahshar] }
            credential_location:
              type: [string, 'null']
              description: Describes where Mahshar injects seller authentication; never contains a credential value or the private query credential name.
            seller_credentials_exposed: { const: false }
        request:
          type: object
          properties:
            outer_method: { type: string }
            content_type: { type: [string, 'null'] }
            body: { type: object }
            dynamic_path: { type: object }
            query_transport: { type: string }
            path_parameters:
              type: array
              items: { $ref: '#/components/schemas/DeclaredParameter' }
            query_parameters:
              type: array
              items: { $ref: '#/components/schemas/DeclaredParameter' }
            example: { type: [object, 'null'] }
            incoming_headers: { type: object }
        response: { type: object }
    DeclaredParameter:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        required: { type: boolean }
        type: { enum: [string, integer, number, boolean] }
        enum: { type: array, items: { type: string } }
        pattern: { type: string, description: Safe declarative pattern; never evaluated as JavaScript regex. }
        minLength: { type: integer, minimum: 0, maximum: 2048 }
        maxLength: { type: integer, minimum: 0, maximum: 2048 }
        minimum: { type: number }
        maximum: { type: number }
        example: { type: [string, number, boolean] }
    Discovery:
      type: object
      required: [marketplace, contract_version, openapi_url, network, payment_protocol, payment_recipient, payment_domain, apis]
      properties:
        marketplace: { const: Mahshar }
        contract_version: { type: string }
        openapi_url: { type: string, format: uri }
        network: { const: 'eip155:5042' }
        payment_protocol: { const: x402 }
        payment_recipient:
          type: string
          description: Expected x402 payTo address. Clients must compare it with the challenge before signing.
        payment_domain:
          type: object
          description: Expected EIP-712 domain. Clients must compare it with the challenge before signing.
        networks: { type: array }
        payment_signature_schema: { type: object }
        recovery: { type: object }
        rate_limits: { type: object }
        pagination: { type: object }
        apis:
          type: array
          items: { $ref: '#/components/schemas/AgentListing' }
  responses:
    PaymentRequired:
      description: Payment required; body is exactly `{}`.
      headers:
        PAYMENT-REQUIRED:
          required: true
          description: Base64-encoded x402 v2 PaymentRequired JSON.
          schema: { type: string }
      content:
        application/json:
          schema: { type: object, maxProperties: 0 }
    PaidResult:
      description: |
        Settlement succeeded. PAYMENT-RESPONSE is a standard base64 x402 v2
        SettleResponse even when upstream delivery is non-2xx. An upstream body
        whose final serialized JSON wrapper exceeds 4,000,000 bytes produces 502 and FAILED_FINAL.
      headers:
        PAYMENT-RESPONSE:
          required: true
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PaidResult' }
    Error:
      description: Machine-readable error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    DeliveryConflict:
      description: Payment accounted; delivery pending, final, or unknown. Do not authorize a second payment.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/Error' }
              - type: object
                properties:
                  error: { const: rate_limited }
                  retry_after_seconds: { type: integer }
